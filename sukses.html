<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briefing Confirmed | Mozens Alqadrie Advisory</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Playfair+Display:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f17;
            --gold-accent: #d4af37;
            --gold-light: #f3e5ab;
            --text-muted: #94a3b8;
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: var(--font-sans);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--gold-accent);
            border-radius: 12px;
            padding: 48px 32px;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.2);
        }
        .icon {
            font-size: 3rem;
            color: var(--gold-accent);
            margin-bottom: 20px;
        }
        h1 {
            font-family: var(--font-serif);
            color: var(--gold-light);
            font-size: 2rem;
            margin-bottom: 12px;
        }
        p { color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 28px; }
        .status-badge {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 24px;
        }
        .btn-home {
            display: inline-block;
            padding: 12px 28px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--bg-dark);
            background: var(--gold-accent);
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#10003;</div>
        <div class="status-badge">&#9679; TRANSACTION VERIFIED & SECURED</div>
        <h1>BRIEFING SCHEDULED</h1>
        <p>Terima kasih. Transaksi dan dokumen briefing Anda telah dicatat oleh sistem konfidensial Mozens Alqadrie Advisory. Tim akan segera menghubungi Anda melalui kontak yang terdaftar.</p>
        <a href="index.html" class="btn-home">&larr; KEMBALI KE BERANDA</a>
    </div>
</body>
</html>
